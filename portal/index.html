<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorplas LLP</title>
</head>
<body style="margin:0;padding:0;overflow:hidden;">
  <iframe id="app" allowfullscreen="true"
    style="position:fixed;top:0;left:0;width:100%;height:100%;border:none;"></iframe>

  <script>
    // Apps Script deployment URL (change here after a NEW deployment).
    var BASE = "https://script.google.com/macros/s/AKfycbz1dXa7Y1s3osxO1skF54zocjQXV84m-SHZtQ-Td79f17zhcx0HumNHncJCDKW4WavBCA/exec";
    var KEY = "fp_portal_token";

    // The login token is kept HERE (colorplas.in, first-party storage) because mobile
    // browsers wipe storage belonging to the cross-site Apps Script frame.
    function getTok() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
    function setTok(t) { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) {} }

    var tok = getTok();
    document.getElementById("app").src = BASE + (tok ? "?fpt=" + encodeURIComponent(tok) : "");

    window.addEventListener("message", function (e) {
      var okOrigin = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/i.test(e.origin);
      var d = e.data;
      if (!okOrigin || !d || d.fpPortal !== 1) return;
      if (d.type === "fp_token" && /^[A-Za-z0-9_\-]{8,128}$/.test(String(d.token || ""))) setTok(d.token);
      else if (d.type === "fp_logout") setTok("");
    });
  </script>
</body>
</html>
